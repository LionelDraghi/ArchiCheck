name: Build and test

on:                    # Run the workflow for each of the following events:
  push:                # - The main branch is pushed or updated.
    branches:
      - master
    paths: &trigger_paths
      - 'src/**'
      - 'lib/**'
      - 'Tests/**'
      - 'Tools/**'
      - '.github/workflows/**'
      - 'Makefile'
      - 'alire.toml'

  pull_request:        # - A pull-request is opened or updated.
    paths: *trigger_paths

  workflow_dispatch:   # - A manual run of the workflow is requested from the GitHub web interface.

  release:
    types: [created]   # - A release is created.

concurrency:
  # A new push cancels the run still in flight.
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false # Don't stop all the workflows when one of them fails.

      # acc is declared available on all platforms (alire.toml has no
      # [available] restriction), so the community index builds and
      # tests it on Linux, macOS and Windows: the CI must cover the
      # three platforms, and they must all be green before any
      # `alr publish` (cf. docs/dev/release_procedure.md, section 1).
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # Check-out the repository
      - uses: actions/checkout@v4

      # Install and setup Alire package manager
      - uses: alire-project/setup-alire@v5
        with:
          # Same version as the local development environment.
          version: 2.1.1

      - name: Relocate the Alire cache on Windows
        # The alr GNAT runtime copies files through a 256-character path
        # buffer: with the default cache under %LOCALAPPDATA%\alire\cache,
        # a deep build dir exceeds it and `alr build` fails with
        # "Could not sync build dir"
        # (cf. https://github.com/alire-project/alire/issues/1762).
        # A short cache root keeps every path under the limit.
        if: runner.os == 'Windows'
        run: alr settings --global --set cache.dir C:\alr-cache

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          # On Linux, alire data is in ~/.cache/alire and ~/.local/share/alire;
          # on Windows runners (runneradmin user), it is in %LOCALAPPDATA%\alire.
          # On Windows, the cache itself is relocated to C:\alr-cache
          # (cf. the relocation step above), and %LOCALAPPDATA%\alire keeps
          # only the settings and indexes.
          path: |
            ~/.cache/alire
            ~/.local/share/alire
            ~/AppData/Local/alire
            C:/alr-cache
          key: ${{ runner.os }}-alire-${{ hashFiles('alire.toml') }}
          restore-keys: |
            ${{ runner.os }}-alire-

      - name: Build bbt
        # The bbt on the Alire community index cannot be used: its latest
        # release is 0.4.1, and when that version cannot be selected
        # (gnat >= 15 constraint), the resolution falls back to ancient
        # versions that do not build with a current GNAT. Build bbt from
        # the repository, and put it on the PATH ($GITHUB_PATH is the
        # binary dir: bbt builds at its root).
        # NB: the branch is pinned to main until the 0.5.1 release,
        # that provides the (ignoring ...) clause used by the scenarios:
        # the 0.5.0 tag predates the feature.
        # NB: bbt pins list_image to a sibling directory: clone it next
        # to the bbt checkout so that the pin resolves.
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/LionelDraghi/bbt /tmp/bbt
          git clone --depth 1 https://github.com/LionelDraghi/List_Image /tmp/list_image
          cd /tmp/bbt && alr --non-interactive build --release
          echo "/tmp/bbt" >> $GITHUB_PATH

      - name: Clone the pinned sibling crates
        # alire.toml pins bbt, opentoken and list_image to sibling
        # directories (../bbt, ../opentoken, ../list_image) during
        # development. Clone them next to the acc checkout so that the
        # pins resolve; `alr build` then builds them as regular
        # dependencies.
        # NB: opentoken master provides the LALR_Parser generic child,
        # required because GNAT 16 cannot instantiate
        # OpenToken.Production.Parser.LALR.Parser (name resolution bug).
        # NB: list_image master provides the Simple_One_Per_Line_Style
        # used by bbt, whose vendored list_image copy was removed in
        # favor of this dependency.
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/LionelDraghi/org.opentoken-6.0c ../opentoken
          git clone --depth 1 --branch main https://github.com/LionelDraghi/bbt ../bbt
          git clone --depth 1 https://github.com/LionelDraghi/List_Image ../list_image

      - name: Run build and checks
        # The doc target is not run here: it uses wget and rgrep, that are
        # not available on all the runners; the generated docs are part
        # of the repository state, committed with the changes.
        run: make -k build tools check

      - name: Save summary
        if: always()
        shell: bash
        run: sed -n '/## Summary/,$p' docs/tests/test_results.md >> ${GITHUB_STEP_SUMMARY} || echo "no results available"

      # Contrary to bbt, the tests results and badges are not published
      # by the CI: they are part of the repository state, committed with
      # the changes.
